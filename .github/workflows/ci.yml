name: Database contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contract-present: ${{ steps.contract.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect a released database contract
        id: contract
        shell: bash
        run: |
          if [[ -f contract.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify reviewed seeds did not lose rows
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base-seeds"
          for seed in smite2-gods smite2-items; do
            git show "$BASE_SHA:supabase/seeds/$seed.sql" \
              > "$RUNNER_TEMP/base-seeds/$seed.sql" 2>/dev/null || true
            node scripts/verify-seed-growth.mjs \
              "$RUNNER_TEMP/base-seeds/$seed.sql" \
              "supabase/seeds/$seed.sql" \
              "$seed"
          done
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          extra_args: --results=verified,unknown
          version: 3.95.9

  database-contract:
    needs: repository-state
    if: ${{ needs.repository-state.outputs.contract-present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:contract
      - run: npx supabase start
      - run: npx supabase db reset --local
      - run: npx supabase db lint --local --fail-on error
      - run: npx supabase test db --local supabase/tests
      - run: npx supabase gen types typescript --local > generated/database.types.actual.ts
      - run: node scripts/normalize-generated-types.mjs generated/database.types.actual.ts
      - run: diff --unified generated/database.types.ts generated/database.types.actual.ts
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
